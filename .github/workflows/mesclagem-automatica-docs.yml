# Mesclagem automática de PRs que alteram SOMENTE documentação.
# Decisão do Marcos de 21/11/2026. Regras, testes e como desfazer: docs/MESCLAGEM-AUTOMATICA.md
#
# Segurança:
# - pull_request_target roda SEMPRE a versão deste arquivo e do script que está na branch de destino
#   (main). Um PR que altere este workflow não muda o comportamento dele mesmo.
# - O código do PR nunca é baixado nem executado: o script lê só a API (lista de arquivos e diff).
# - Permissões mínimas: nada no nível do workflow; o job pede só o necessário para mesclar e comentar.
name: Mesclagem automática de documentação

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches: [main]

permissions: {}

concurrency:
  group: mesclagem-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificar-e-mesclar:
    # Filtro rápido (o script repete todas as verificações)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'reencontra-tudo' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # mesclar o PR
      pull-requests: write   # ler os arquivos do PR e comentar
    steps:
      - name: Baixar só o script da branch de destino (nunca o código do PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/automacao
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verificar e mesclar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          BASE_PERMITIDA: main
        run: python3 -I .github/automacao/mesclagem_docs.py
